<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NUST Prep</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #030712; --surface: rgba(255,255,255,0.02); --border: rgba(255,255,255,0.06);
    --text: #e2e8f0; --text-dim: rgba(255,255,255,0.45); --text-muted: rgba(255,255,255,0.25);
    --blue: #2563eb; --blue-light: #60a5fa; --green: #059669; --green-light: #34d399;
    --purple: #7c3aed; --purple-light: #a78bfa; --red: #ef4444; --yellow: #eab308;
    --amber: #fbbf24;
  }
  body {
    background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif;
    min-height: 100vh; -webkit-app-region: drag; overflow-x: hidden;
  }
  button, input, textarea, select { -webkit-app-region: no-drag; }
  .no-drag { -webkit-app-region: no-drag; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  /* Layout */
  .container { max-width: 820px; margin: 0 auto; padding: 20px; }
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 52px 20px 18px; }
  .header .container { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 8px; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 14px; }
  .stats-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .stat { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; flex: 1; min-width: 120px; }
  .stat-label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .stat-value { font-size: 26px; font-weight: 800; margin-top: 2px; line-height: 1.1; }
  .stat-sub { color: var(--text-muted); font-size: 11px; margin-top: 3px; }

  /* Buttons */
  .btn { border: none; padding: 11px 24px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 700; font-family: inherit; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn-blue { background: var(--blue); color: #fff; }
  .btn-green { background: var(--green); color: #fff; }
  .btn-purple { background: var(--purple); color: #fff; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-amber { background: #d97706; color: #fff; }
  .btn-ghost { background: rgba(255,255,255,0.04); color: var(--text-dim); border: 1px solid var(--border); }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

  /* Progress bar */
  .pbar { background: rgba(255,255,255,0.06); border-radius: 5px; height: 8px; width: 100%; overflow: hidden; }
  .pbar-fill { height: 100%; border-radius: 5px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }

  /* Tags */
  .tag { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; }

  /* Options */
  .option-btn { width: 100%; background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 14px 16px; text-align: left; color: var(--text); font-size: 15px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; font-family: inherit; transition: all 0.15s; margin-bottom: 8px; }
  .option-btn:hover { border-color: rgba(255,255,255,0.15); }
  .option-btn.selected { border-color: var(--blue); background: rgba(37,99,235,0.08); }
  .option-btn.correct { border-color: var(--green); background: rgba(5,150,105,0.08); }
  .option-btn.wrong { border-color: var(--red); background: rgba(239,68,68,0.08); }
  .option-letter { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0; background: rgba(255,255,255,0.08); }
  .option-btn.selected .option-letter { background: var(--blue); }
  .option-btn.correct .option-letter { background: var(--green); }
  .option-btn.wrong .option-letter { background: var(--red); }

  /* Question grid */
  .q-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 20px; }
  .q-dot { width: 34px; height: 30px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font-size: 11px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.1s; font-family: inherit; }
  .q-dot.answered { background: rgba(37,99,235,0.2); color: var(--blue-light); }
  .q-dot.current { border: 2px solid var(--blue-light); }

  /* Calendar */
  .cal-grid { display: flex; flex-wrap: wrap; gap: 5px; }
  .cal-day { width: 40px; height: 40px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--surface); transition: all 0.15s; }
  .cal-day.today { border: 2px solid var(--blue); background: rgba(37,99,235,0.15); }
  .cal-day.done { opacity: 0.5; }
  .cal-num { font-size: 10px; font-weight: 700; }
  .cal-sec { font-size: 8px; color: var(--text-muted); }

  /* Section label */
  .section-label { display: inline-block; padding: 4px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; color: #fff; letter-spacing: 0.03em; }

  /* Explanation box */
  .explanation { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 13px; color: var(--text-dim); line-height: 1.6; margin-top: 10px; }

  /* Import textarea */
  .import-area { width: 100%; min-height: 260px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 16px; color: var(--text); font-size: 13px; font-family: 'SF Mono', 'Fira Code', monospace; resize: vertical; outline: none; }
  .import-area:focus { border-color: var(--blue); }

  /* Notification */
  .notif { position: fixed; top: 56px; right: 20px; background: #065f46; border: 1px solid #10b981; color: #6ee7b7; padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 100; animation: slideIn 0.3s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  /* Review item */
  .review-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
  .review-q { font-size: 14px; color: #f1f5f9; margin-bottom: 8px; line-height: 1.6; }
  .review-wrong { font-size: 12px; color: #fca5a5; margin-bottom: 3px; }
  .review-correct { font-size: 12px; color: #6ee7b7; margin-bottom: 8px; }

  .hidden { display: none !important; }

  /* Topic row */
  .topic-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .topic-name { width: 180px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topic-bar { flex: 1; }
  .topic-score { width: 50px; text-align: right; color: var(--text-muted); font-size: 12px; }
</style>
</head>
<body>

<div id="app"></div>

<script>
const SECTIONS = {
  quantitative: { label: "Quantitative", total: 35, color: "#2563eb", accent: "#60a5fa", icon: "∑" },
  verbal: { label: "Verbal", total: 35, color: "#059669", accent: "#34d399", icon: "Aa" },
  analytical: { label: "Analytical", total: 30, color: "#7c3aed", accent: "#a78bfa", icon: "◇" },
};
const BASELINE = { quantitative: 31, verbal: 19, analytical: 20 };
const ROTATION = ["verbal","analytical","verbal","quantitative","verbal","analytical"];

// ── State ──
let state = {
  page: "home", // home | test | results | progress | import | learn | lesson
  progress: { currentDay: 1, sessions: [], mockSessions: [] },
  questions: [],
  answers: {},
  currentQ: 0,
  section: null,
  elapsed: 0,
  showExplanation: false,
  notification: null,
  availableDays: [],
  importText: "",
  importSection: "verbal",
  learnSection: "verbal",
  lessons: [],
  currentLesson: null,
  lessonAnswers: {},
  lessonPrevPage: "home",
  learnSearch: "",
};

let timerInterval = null;

// ── Data ──
async function loadData() {
  try {
    state.progress = await window.nustPrep.getProgress();
    state.availableDays = await window.nustPrep.listAvailableDays();
  } catch (e) { console.error("Load error:", e); }
}

async function saveProgress() {
  try { await window.nustPrep.saveProgress(state.progress); } catch (e) { console.error("Save error:", e); }
}

function getSchedule(day) {
  if (day > 18) return { type: "mock", section: null, label: "Mock Test" };
  const sec = ROTATION[(day - 1) % 6];
  return { type: "practice", section: sec, label: SECTIONS[sec].label + " Practice" };
}

function sessionsFor(sec) { return state.progress.sessions.filter(s => s.section === sec); }

function weakTopics(sec) {
  const m = {};
  sessionsFor(sec).forEach(s => (s.details||[]).forEach(d => {
    if (!m[d.topic]) m[d.topic] = {c:0,t:0}; m[d.topic].t++; if (d.correct) m[d.topic].c++;
  }));
  return Object.entries(m).filter(([,v]) => v.t>=2 && v.c/v.t<0.6)
    .sort((a,b) => a[1].c/a[1].t - b[1].c/b[1].t).slice(0,5).map(([k])=>k);
}

function latestEst(sec) {
  const s = sessionsFor(sec);
  if (!s.length) return BASELINE[sec];
  const last = s[s.length-1];
  return Math.round((last.score/last.total) * SECTIONS[sec].total);
}

function avgAcc(sec) {
  const s = sessionsFor(sec);
  if (!s.length) return Math.round((BASELINE[sec]/SECTIONS[sec].total)*100);
  return Math.round((s.reduce((a,x)=>a+x.score,0) / s.reduce((a,x)=>a+x.total,0))*100);
}

function projected() { return latestEst("quantitative") + latestEst("verbal") + latestEst("analytical"); }

function scoreInfo() {
  let c=0,w=0,u=0;
  state.questions.forEach((q,i) => {
    if (state.answers[i]===undefined) u++; else if (state.answers[i]===q.correct) c++; else w++;
  });
  const total = state.questions.length;
  return { c, w, u, pct: total ? Math.round(c/total*100) : 0, total };
}

function fmtTime(s) { return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }

function notify(msg) {
  state.notification = msg;
  render();
  setTimeout(() => { state.notification = null; render(); }, 3000);
}

// ── Actions ──
async function loadTodayQuestions() {
  const result = await window.nustPrep.getTodayQuestions();
  if (result.questions && result.questions.length > 0) {
    state.questions = result.questions;
    state.section = result.section;
    state.answers = {};
    state.currentQ = 0;
    state.elapsed = 0;
    state.showExplanation = false;
    startTimer();
    state.page = "test";
    render();
  } else {
    state.page = "import";
    render();
  }
}

async function loadSpecificDay(filename, section) {
  const qs = await window.nustPrep.loadQuestionsFile(filename);
  if (qs && qs.length > 0) {
    state.questions = qs;
    state.section = section;
    state.answers = {};
    state.currentQ = 0;
    state.elapsed = 0;
    state.showExplanation = false;
    startTimer();
    state.page = "test";
    render();
  }
}

function importQuestions() {
  try {
    const trimmed = state.importText.trim().replace(/^```json?\s*/i,"").replace(/```\s*$/,"").trim();
    const parsed = JSON.parse(trimmed);
    if (!Array.isArray(parsed) || !parsed.length) { alert("Must be a non-empty JSON array."); return; }
    const qs = parsed.map((q,i) => ({
      id: q.id || i+1, topic: q.topic||"General", difficulty: q.difficulty||"medium",
      question: q.question, options: q.options, correct: (q.correct||"A").toUpperCase(),
      explanation: q.explanation||"",
    }));
    // Save to file
    const day = state.progress.currentDay;
    window.nustPrep.importQuestionsJSON({ day, section: state.importSection, questions: qs });
    state.questions = qs;
    state.section = state.importSection;
    state.answers = {};
    state.currentQ = 0;
    state.elapsed = 0;
    state.showExplanation = false;
    state.importText = "";
    startTimer();
    state.page = "test";
    render();
  } catch(e) { alert("Invalid JSON: " + e.message); }
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => { state.elapsed++; updateTimerDisplay(); }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById("timer");
  if (el) el.textContent = "⏱ " + fmtTime(state.elapsed);
}

function submitTest() {
  clearInterval(timerInterval);
  const details = state.questions.map((q,i) => ({
    topic: q.topic, correct: state.answers[i] === q.correct, difficulty: q.difficulty,
  }));
  const score = details.filter(d=>d.correct).length;
  state.progress.sessions.push({
    day: state.progress.currentDay, section: state.section,
    date: new Date().toISOString(), score, total: state.questions.length,
    time: state.elapsed, details, percentage: Math.round(score/state.questions.length*100),
  });
  state.progress.currentDay++;
  saveProgress();
  state.page = "results";
  render();
}

// ── Render ──
function render() {
  const app = document.getElementById("app");
  const p = state.progress;
  const day = p.currentDay;
  const sched = getSchedule(day);

  // Notification
  let notifHTML = state.notification ? `<div class="notif">${state.notification}</div>` : "";

  if (state.page === "test") { renderTest(app, notifHTML); return; }
  if (state.page === "results") { renderResults(app, notifHTML); return; }
  if (state.page === "progress") { renderProgress(app, notifHTML); return; }
  if (state.page === "import") { renderImport(app, notifHTML); return; }
  if (state.page === "learn") { renderLearn(app, notifHTML); return; }
  if (state.page === "lesson") { renderLesson(app, notifHTML); return; }

  // ── HOME ──
  const secColor = sched.section ? SECTIONS[sched.section].color : "#d97706";
  const secAccent = sched.section ? SECTIONS[sched.section].accent : "#fbbf24";
  const wk = sched.section ? weakTopics(sched.section) : [];
  const proj = projected();

  const todayFile = state.availableDays.find(d => d.day === day);
  const hasQuestions = !!todayFile;

  app.innerHTML = `${notifHTML}
  <div class="header">
    <div class="container">
      <div>
        <h1 style="font-size:22px;font-weight:800;letter-spacing:-0.02em">NUST NET Prep</h1>
        <p style="color:var(--text-dim);font-size:12px;margin-top:4px">Day ${day} of 30 · Target: 85-90 · Baseline: 70</p>
      </div>
      <div style="text-align:right">
        <div style="font-size:36px;font-weight:800;color:${proj >= 85 ? '#34d399' : '#fbbf24'}">${proj}<span style="font-size:14px;color:var(--text-muted);font-weight:400">/100</span></div>
      </div>
    </div>
  </div>
  <div class="container no-drag">
    <div style="margin:18px 0 18px"><div class="pbar"><div class="pbar-fill" style="width:${Math.round((day-1)/30*100)}%;background:var(--blue)"></div></div></div>

    <div class="stats-row">
      ${Object.entries(SECTIONS).map(([k,s]) => `
        <div class="stat">
          <div class="stat-label">${s.label}</div>
          <div class="stat-value" style="color:${s.accent}">${avgAcc(k)}%</div>
          <div class="stat-sub">Est. ${latestEst(k)}/${s.total}</div>
        </div>`).join("")}
    </div>

    <div class="card" style="background:linear-gradient(135deg,${sched.section ? SECTIONS[sched.section].color+'15' : '#d9770615'},transparent)">
      <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px">Today — Day ${day}</div>
      <h2 style="font-size:20px;font-weight:700;color:${secAccent};margin-bottom:8px">
        ${sched.section ? SECTIONS[sched.section].icon : '📝'} ${sched.label}
      </h2>
      <p style="color:var(--text-dim);font-size:13px;margin-bottom:${wk.length ? '4px' : '16px'}">
        ${sched.type === 'mock' ? '30 questions (12Q + 12V + 6A)' : '50 questions · ~45 min · Adaptive difficulty'}
      </p>
      ${wk.length ? `<p style="color:#fca5a5;font-size:12px;margin-bottom:16px">Focus: ${wk.join(', ')}</p>` : ''}
      ${hasQuestions
        ? `<button class="btn" style="background:${secColor}" onclick="loadTodayQuestions()">Start Today's Test →</button>
           <span style="color:var(--green-light,#6ee7b7);font-size:12px;margin-left:12px">✓ Questions ready</span>`
        : `<button class="btn" style="background:${secColor}" onclick="state.page='import';render()">Import Questions →</button>
           <span style="color:var(--text-muted);font-size:12px;margin-left:12px">No questions yet — generate in Claude Code</span>`
      }
    </div>

    <div class="btn-row" style="margin-bottom:18px">
      <button class="btn btn-ghost" style="flex:1;min-width:120px" onclick="state.page='progress';render()">📊 Progress</button>
      <button class="btn btn-ghost" style="flex:1;min-width:120px" onclick="goToLearn('home')">📚 Learn</button>
      <button class="btn btn-ghost" style="flex:1;min-width:120px" onclick="state.page='import';render()">+ Import</button>
    </div>

    ${state.availableDays.length > 0 ? `
    <div class="card">
      <h3 style="font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">Available Question Sets</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${state.availableDays.map(d => {
          const s = SECTIONS[d.section] || { accent: '#fbbf24', label: d.section };
          return `<button class="btn btn-ghost" style="border-color:${s.accent}33;color:${s.accent}" onclick="loadSpecificDay('${d.file}','${d.section}')">Day ${d.day} — ${s.label || d.section}</button>`;
        }).join("")}
      </div>
    </div>` : ''}

    <div class="card">
      <h3 style="font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px">30-Day Plan</h3>
      <div class="cal-grid">
        ${Array.from({length:30},(_,i) => {
          const d = i+1;
          const sc = getSchedule(d);
          const done = d < day;
          const today = d === day;
          const col = sc.section ? SECTIONS[sc.section].color : '#d97706';
          const acc = sc.section ? SECTIONS[sc.section].accent : '#fbbf24';
          return `<div class="cal-day ${today?'today':''} ${done?'done':''}" style="${today?'border-color:'+col+';background:'+col+'22':done?'border-color:'+col+'33':''}">
            <div class="cal-num" style="color:${done||today?acc:'var(--text-muted)'}">${d}</div>
            <div class="cal-sec">${sc.type==='mock'?'M':sc.section[0].toUpperCase()}</div>
          </div>`;
        }).join("")}
      </div>
      <div style="display:flex;gap:16px;margin-top:10px;font-size:10px;color:var(--text-muted)">
        <span><span style="color:${SECTIONS.verbal.accent}">●</span> Verbal</span>
        <span><span style="color:${SECTIONS.analytical.accent}">●</span> Analytical</span>
        <span><span style="color:${SECTIONS.quantitative.accent}">●</span> Quant</span>
        <span><span style="color:#fbbf24">●</span> Mock</span>
      </div>
    </div>

    <div class="card">
      <h3 style="font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">How To Use</h3>
      <div style="font-size:13px;color:var(--text-dim);line-height:1.8">
        <b style="color:var(--text)">1.</b> Open <b style="color:var(--blue-light)">Claude Code</b> and say: <i style="color:var(--blue-light)">"Generate 50 NUST GNET ${sched.section || 'verbal'} MCQs as a JSON array"</i><br>
        <b style="color:var(--text)">2.</b> Claude Code saves to <code style="color:#fbbf24">/Users/Shared/nust-prep/data/questions/</code><br>
        <b style="color:var(--text)">3.</b> Questions auto-appear here — or paste JSON manually via <b>Import</b><br>
        <b style="color:var(--text)">4.</b> Take the test → Review → Track progress
      </div>
    </div>

    <div style="text-align:center;margin-top:16px">
      <button class="btn btn-ghost" style="font-size:10px;color:var(--text-muted);border-color:transparent"
        onclick="if(confirm('Reset all progress?')){state.progress={currentDay:1,sessions:[],mockSessions:[]};saveProgress();render();}">Reset Progress</button>
    </div>
  </div>`;
}

function renderTest(app, notifHTML) {
  const q = state.questions[state.currentQ];
  const s = SECTIONS[state.section] || { label: state.section, color: '#2563eb', accent: '#60a5fa' };
  const answered = state.answers[state.currentQ] !== undefined;

  app.innerHTML = `${notifHTML}
  <div style="background:var(--surface);border-bottom:1px solid var(--border);padding:52px 20px 12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="section-label" style="background:${s.color}">${s.label}</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;font-size:13px">
      <button class="btn btn-ghost" style="padding:6px 14px;font-size:11px" onclick="goToLearn('test')">📚 Learn</button>
      <span id="timer" style="color:var(--text-dim);font-variant-numeric:tabular-nums">⏱ ${fmtTime(state.elapsed)}</span>
      <span style="color:${s.accent};font-weight:600">Q ${state.currentQ+1} / ${state.questions.length}</span>
    </div>
  </div>
  <div class="container no-drag" style="padding-top:24px">
    <div style="margin-bottom:10px">
      <span class="tag" style="background:rgba(255,255,255,0.06);color:var(--text-dim)">${q.topic}</span>
      <span class="tag" style="background:${q.difficulty==='hard'?'rgba(239,68,68,0.15)':q.difficulty==='medium'?'rgba(245,158,11,0.15)':'rgba(16,185,129,0.15)'};color:${q.difficulty==='hard'?'#fca5a5':q.difficulty==='medium'?'#fcd34d':'#6ee7b7'}">${q.difficulty}</span>
    </div>
    <div style="font-size:17px;line-height:1.7;color:#f1f5f9;margin-bottom:24px">
      <span style="color:var(--text-muted);font-weight:700;margin-right:8px">${state.currentQ+1}.</span>${q.question}
    </div>
    <div id="options">
      ${["A","B","C","D"].map(opt => {
        const sel = state.answers[state.currentQ] === opt;
        const showRes = state.showExplanation && answered;

        let cls = sel ? "selected" : "";
        if (showRes && isCorrect) cls = "correct";
        else if (showRes && sel && !isCorrect) cls = "wrong";
        const letterBg = showRes ? (isCorrect ? 'var(--green)' : (sel ? 'var(--red)' : 'rgba(255,255,255,0.08)')) : (sel ? s.color : 'rgba(255,255,255,0.08)');

        return `<button class="option-btn ${cls}" onclick="${state.showExplanation ? '' : `state.answers[${state.currentQ}]='${opt}';render()`}">
          <span class="option-letter" style="background:${letterBg}">${letterText}</span>
          <span style="padding-top:4px;line-height:1.5">${q.options[opt]}</span>

      }).join("")}
    </div>

        ? `<button class="btn" style="background:${s.color}" onclick="state.currentQ++;state.showExplanation=false;render()">Next →</button>`

      ${state.questions.map((_,i) => `<button class="q-dot ${state.answers[i]!==undefined?'answered':''} ${state.currentQ===i?'current':''}" onclick="state.currentQ=${i};state.showExplanation=false;render()">${i+1}</button>`).join("")}
    </div>
  </div>`;

// ── Learn helpers ──
function topicAccuracy(section) {
  const m = {};
  sessionsFor(section).forEach(s => (s.details || []).forEach(d => {
    if (!m[d.topic]) m[d.topic] = { c: 0, t: 0 };
    m[d.topic].t++;
    if (d.correct) m[d.topic].c++;
  }));
  return m;
}

function lessonReadTime(lesson) {
  const text = [
    lesson.summary || "",
    ...(lesson.key_rules || []),
    ...(lesson.worked_examples || []).map(e => `${e.question} ${e.wrong} ${e.correct} ${e.why}`),
    ...(lesson.common_mistakes || []),
    ...(lesson.exam_tips || []),
  ].join(" ");
  return Math.max(1, Math.round(text.split(/\s+/).length / 200));
}

// ── Learn actions ──
async function goToLearn(fromPage) {
  state.lessonPrevPage = fromPage;
  state.page = "learn";
  state.lessons = await window.nustPrep.loadLessons(state.learnSection);
  render();
}

async function switchLearnSection(section) {
  state.learnSection = section;
  state.learnSearch = "";
  state.lessons = await window.nustPrep.loadLessons(section);
  render();
}

function openLesson(topicIndex) {
  state.currentLesson = state.lessons[topicIndex];
  state.lessonAnswers = {};
  state.page = "lesson";
  render();
}

// ── Learn ──
function renderLearn(app, notifHTML) {
  const sec = state.learnSection;
  const s = SECTIONS[sec];
  const acc = topicAccuracy(sec);
  const wk = weakTopics(sec);
  const lessons = state.lessons;

  const sorted = [...lessons].sort((a, b) => {
    const aWeak = wk.includes(a.topic);
    const bWeak = wk.includes(b.topic);
    if (aWeak && !bWeak) return -1;
    if (!aWeak && bWeak) return 1;
    return a.topic.localeCompare(b.topic);
  });

  const query = (state.learnSearch || "").toLowerCase().trim();
  const filtered = query ? sorted.filter(l => l.topic.toLowerCase().includes(query)) : sorted;

  const weakCount = sorted.filter(l => wk.includes(l.topic)).length;
  const totalCount = sorted.length;

  const tabBtn = (key) => {
    const ts = SECTIONS[key];
    const active = key === sec;
    return `<button class="btn ${active ? '' : 'btn-ghost'}" style="${active ? 'background:' + ts.color : ''};flex:1" onclick="switchLearnSection('${key}')">${ts.icon} ${ts.label}</button>`;
  };

  const topicCards = filtered.map((lesson) => {
    const isWeak = wk.includes(lesson.topic);
    const topicAcc = acc[lesson.topic];
    const pct = topicAcc ? Math.round(topicAcc.c / topicAcc.t * 100) : null;
    const readTime = lessonReadTime(lesson);
    const borderStyle = isWeak ? 'border-color:rgba(239,68,68,0.4);background:rgba(239,68,68,0.06)' : '';
    const accBadge = pct !== null
      ? `<span class="tag" style="background:${pct < 60 ? 'rgba(239,68,68,0.15)' : pct < 75 ? 'rgba(245,158,11,0.15)' : 'rgba(16,185,129,0.15)'};color:${pct < 60 ? '#fca5a5' : pct < 75 ? '#fcd34d' : '#6ee7b7'}">${pct}%</span>`
      : `<span style="color:var(--text-muted);font-size:11px">not studied</span>`;
    const realIndex = lessons.indexOf(lesson);
    return `<div class="card" style="cursor:pointer;${borderStyle}" onclick="openLesson(${realIndex})">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:14px;font-weight:600;color:${isWeak ? '#fca5a5' : 'var(--text)'}">
            ${lesson.topic}
            ${isWeak ? `<span class="tag" style="background:rgba(239,68,68,0.15);color:#fca5a5;margin-left:6px">WEAK</span>` : ''}
          </div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:3px">~${readTime} min read</div>
        </div>
        <div style="text-align:right">${accBadge}</div>
      </div>
    </div>`;
  }).join("");

  const emptyState = totalCount === 0
    ? `<div class="card" style="text-align:center;padding:32px;color:var(--text-muted)">
        No lessons yet.<br><br>
        <span style="font-size:12px">Tell Claude Code: <span style="color:var(--blue-light);font-style:italic">"Generate learning content for NUST Prep"</span></span>
       </div>`
    : filtered.length === 0
    ? `<div class="card" style="text-align:center;padding:24px;color:var(--text-muted)">No topics match "<span style="color:var(--text)">${state.learnSearch}</span>"</div>`
    : topicCards;

  app.innerHTML = `${notifHTML}
  <div class="header">
    <div class="container">
      <div>
        <h1 style="font-size:22px;font-weight:800;letter-spacing:-0.02em">Learn</h1>
        <p style="color:var(--text-dim);font-size:12px;margin-top:4px">${totalCount} topics${weakCount ? ` · <span style="color:#fca5a5">${weakCount} weak</span>` : ''}</p>
      </div>
      <button class="btn btn-ghost" onclick="state.page=state.lessonPrevPage;render()">← Back</button>
    </div>
  </div>
  <div class="container no-drag" style="padding-top:20px">
    <div class="btn-row" style="margin-bottom:12px">
      ${tabBtn("verbal")}${tabBtn("analytical")}${tabBtn("quantitative")}
    </div>
    <input
      type="text"
      placeholder="Search topics…"
      value="${(state.learnSearch || '').replace(/"/g, '&quot;')}"
      oninput="state.learnSearch=this.value;render()"
      style="width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-size:13px;font-family:inherit;outline:none;margin-bottom:12px"
      class="no-drag"
    />
    ${weakCount > 0 && !query ? `
    <div class="card" style="background:rgba(239,68,68,0.06);border-color:rgba(239,68,68,0.25);margin-bottom:4px">
      <div style="font-size:12px;color:#fca5a5;font-weight:600">⚠ Weak topics — prioritize these</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:4px">${wk.join(' · ')}</div>
    </div>` : ''}
    ${emptyState}
  </div>`;
}

  </div>`;
}

// ── Init ──
async function init() {
  await loadData();
  render();

  // Listen for new question files from Claude Code
  if (window.nustPrep && window.nustPrep.onQuestionsUpdated) {
    window.nustPrep.onQuestionsUpdated(async (filename) => {
      state.availableDays = await window.nustPrep.listAvailableDays();
      notify(`New questions ready: ${filename}`);
    });
  }
}

init();
</script>
</body>
</html>
